    :root{--bg:#0f172a;--panel:#1e293b;--border:#334155;--pwr:#ef4444;--gnd:#10b981;--sig:#38bdf8;--text:#e2e8f0;--muted:#94a3b8}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);overscroll-behavior:none;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;-webkit-font-smoothing:antialiased}
    #root{height:100dvh;display:flex;flex-direction:column}
    .app{height:100%;display:flex;flex-direction:column;background:var(--bg);contain:strict}
    .header{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;contain:strict;gap:8px}
    .header-left{display:flex;align-items:center;gap:10px;min-width:0}
    .header-title{font-weight:700;font-size:12px;letter-spacing:0.06em;white-space:nowrap}
    .header-title span{color:var(--muted);font-weight:400;margin-left:6px}
    .out-group{display:flex;align-items:center;gap:8px}
    .out-label{font-size:10px;color:var(--muted);letter-spacing:0.05em}
    .out-sw{width:42px;height:28px;background:var(--bg);border:1px solid var(--border);border-radius:14px;position:relative;cursor:pointer;contain:layout;flex-shrink:0;touch-action:manipulation}
    .out-sw.on{background:rgba(239,68,68,0.18);border-color:var(--pwr)}
    .out-sw-thumb{width:22px;height:22px;background:#e2e8f0;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform 0.16s cubic-bezier(.2,.8,.2,1);will-change:transform;box-shadow:0 1px 2px rgba(0,0,0,0.3)}
    .out-sw.on .out-sw-thumb{transform:translateX(14px);background:white}
    .header-actions{display:flex;gap:6px}
    .icon-btn{width:40px;height:32px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:14px;touch-action:manipulation}
    .icon-btn:active{transform:scale(0.96)}
    .workspace{flex:1;position:relative;overflow:hidden;touch-action:none;background:var(--bg);contain:strict}
    .grid-canvas,.wires-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
    .grid-canvas{z-index:0}
    .wires-canvas{z-index:1}
    .components-layer{position:absolute;inset:0;z-index:2;pointer-events:none}
    .hw-component{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:8px;contain:layout style paint;content-visibility:auto;transform:translate3d(0,0,0);pointer-events:auto;user-select:none;touch-action:none;min-width:80px}
    .hw-component.dragging{will-change:transform;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.45);border-color:#475569}
    .hw-component.lmu{width:220px;height:160px;background:linear-gradient(180deg,#1e293b 0%,#172033 100%)}
    .hw-component.relay{width:120px;height:100px}
    .hw-component.lamp{width:80px;height:80px;border-radius:10px}
    .comp-header{height:28px;padding:0 8px;font-size:11px;font-weight:600;letter-spacing:0.04em;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.12);border-radius:8px 8px 0 0}
    .comp-header .type{color:var(--muted);font-size:9px;letter-spacing:0.08em}
    .comp-body{position:relative;width:100%;height:calc(100% - 28px)}
    .lamp-bulb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:#0b1220;border:1px solid var(--border);display:grid;place-items:center;transition:background 0.2s,box-shadow 0.2s}
    .lamp-bulb.on{background:radial-gradient(circle at 35% 35%, #fef08a 0%, #facc15 35%, #eab308 70%);box-shadow:0 0 18px rgba(250,204,21,0.6);border-color:#facc15}
    .lamp-bulb.off{opacity:0.8}
    .pin-hit{position:absolute;width:44px;height:44px;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);cursor:pointer;touch-action:none;pointer-events:auto;z-index:3}
    .pin{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);background:#334155;transition:transform 0.12s,background 0.12s;contain:layout}
    .pin-hit:active .pin{transform:scale(1.15)}
    .pin.selected{transform:scale(1.25);outline:2px solid var(--sig);outline-offset:2px}
    .pin-label{position:absolute;top:50%;font-size:9px;color:var(--muted);white-space:nowrap;pointer-events:none;transform:translateY(-50%);letter-spacing:0.02em}
    .pin-label.left{right:100%;margin-right:6px}
    .pin-label.right{left:100%;margin-left:6px}
    .dock{height:72px;display:flex;gap:10px;align-items:center;justify-content:space-around;background:var(--panel);border-top:1px solid var(--border);padding:0 10px;flex-shrink:0;contain:strict}
    .dock-btn{width:56px;height:56px;border-radius:12px;background:var(--bg);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;letter-spacing:0.05em;color:var(--text);cursor:pointer;touch-action:manipulation;contain:layout}
    .dock-btn:active{transform:scale(0.95)}
    .dock-btn .ico{font-size:16px;line-height:1}
    .status{position:absolute;bottom:8px;left:10px;font-size:11px;color:var(--muted);background:rgba(15,23,42,0.88);border:1px solid var(--border);padding:4px 8px;border-radius:6px;pointer-events:none;z-index:5;contain:layout;letter-spacing:0.02em}
    .status b{color:var(--text);font-weight:600}
    .hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);background:rgba(15,23,42,0.9);border:1px solid var(--border);padding:4px 10px;border-radius:20px;pointer-events:none;z-index:5;white-space:nowrap}
    @media (max-width:768px){
      .header-title span{display:none}
      .out-label{display:none}
